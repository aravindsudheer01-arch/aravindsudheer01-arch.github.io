<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img"><title>The research assistant workflow, showing source reconciliation before saving</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#283c30" stroke-opacity=".07"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#5b6c5f" stroke-width="1.2"/></marker></defs><rect width="800" height="500" fill="#ebe8e1"/><rect width="800" height="500" fill="url(#grid)"/><text x="44" y="45" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#536354" >QUESTION → SEARCH → STRUCTURE → SAVE</text><rect x="45" y="102" width="190" height="80" rx="4" fill="#faf9f5" stroke="#a5afa1"/><text x="61" y="132" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#27382f" >User question</text><text x="61" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6c776d" >Command line</text><path d="M235 142L290 142" stroke="#5b6c5f" stroke-width="1.6" fill="none" marker-end="url(#arrow)" /><rect x="300" y="102" width="195" height="80" rx="4" fill="#263e32" stroke="#a5afa1"/><text x="316" y="132" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#faf9f5" >Search tool</text><text x="316" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b8c9bb" >DDGS links &amp; snippets</text><path d="M495 142L550 142" stroke="#5b6c5f" stroke-width="1.6" fill="none" marker-end="url(#arrow)" /><rect x="560" y="102" width="190" height="80" rx="4" fill="#faf9f5" stroke="#a5afa1"/><text x="576" y="132" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#27382f" >LLM response</text><text x="576" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6c776d" >Pydantic schema</text><path d="M655 182V245H147V310" fill="none" stroke="#6c7b68" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="45" y="320" width="340" height="86" rx="4" fill="#faf9f5" stroke="#a5afa1"/><text x="61" y="350" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#27382f" >Reconcile source URLs</text><text x="61" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6c776d" >Against observed search results</text><path d="M390 363L450 363" stroke="#5b6c5f" stroke-width="1.6" fill="none" marker-end="url(#arrow)" /><rect x="465" y="320" width="285" height="86" rx="4" fill="#263e32" stroke="#a5afa1"/><text x="481" y="350" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#faf9f5" >Timestamped report</text><text x="481" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b8c9bb" >Local storage · no backend</text><text x="45" y="465" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#536354" >Provenance checking ≠ verification of factual claims</text></svg>